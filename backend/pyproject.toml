[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "manufacturing-knowledge-agent"
version = "0.1.0"
description = "Portfolio-safe MCP and RAG workspace for synthetic manufacturing operations."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "mcp>=2.2,<3",
  "openai>=2.0,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
mka-api = "manufacturing_agent.api:run"
mka-mcp = "manufacturing_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["manufacturing_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
